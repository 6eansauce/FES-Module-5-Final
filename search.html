<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search</title>
    <link rel="stylesheet" href="./style.css" />

    <script src="./search.js"></script>
    <script
      src="https://kit.fontawesome.com/fb4e81fea9.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="header header--search">
      <div class="l-container">
        <nav class="navbar navbar--search">
          <div class="brand">
            <span class="brand__name">Oscar J.</span>
          </div>

          <ul class="navbar__links">
            <li>
              <a class="navbar__link" href="./index.html">Home</a>
            </li>

            <li>
              <a class="navbar__link" href="#">Search</a>
            </li>

            <li>
              <a
                class="button button--white"
                href=""
                onclick="
                  alert('This is a Contact button.');
                  return false;
                "
                >Contact Us</a
              >
            </li>
          </ul>

          <button
            class="navbar__toggle button button--bare"
            onclick="openModal()"
          >
            <i class="fa-bars fa-solid"></i>
          </button>
        </nav>

        <div class="header__inner">
          <h1 class="header__title">Browse Our Movies</h1>
          <form class="searchbar searchbar--overlay" id="searchbar">
            <input
              type="text"
              class="searchbar__input"
              placeholder="Search by movie title or keyword..."
              required
            />
            <button class="searchbar__button button button--bare">
              <i class="fa-magnifying-glass fa-solid"></i>
            </button>
          </form>
        </div>
      </div>
    </header>

    <dialog class="modal" id="modal">
      <div class="modal__inner">
        <h2 class="modal__title">Menu</h2>
        <button class="modal__close button button--bare" onclick="closeModal()">
          <i class="fa-xmark fa-solid"></i>
        </button>

        <nav class="modal__nav">
          <h3>Navigation</h3>

          <ul class="modal__links">
            <li class="modal__link">
              <a href="#">Home</a>
            </li>

            <li class="modal__link">
              <a href="./search.html">Search</a>
            </li>

            <li class="modal__link"><a href="">Contact Us</a></li>
          </ul>
        </nav>
      </div>
    </dialog>

    <main>
      <div class="l-container"></div>
    </main>
  </body>
</html>
